<div class="mb16 mt16">
  <h2 class="h3 center">Kugel Eis €1.80</h2>
  <app-title title="Unsere Eissorten" />
</div>

<app-product-list [products]="ice" (productClick)="openModal($event)" />

<div
  class="modal-backdrop"
  *ngIf="selectedProduct"
  (click)="closeModal()"
></div>
<div class="modal" *ngIf="selectedProduct">
  <button class="modal-close" (click)="closeModal()">
    <img src="/image/svg/x.svg" alt="x" />
  </button>
  <div class="product__item">
    <div class="item-header">
      <div class="item-image">
        <img [src]="selectedProduct.image" alt="Image" />
      </div>
      <div class="item-price">
        {{ selectedProduct.price | currency : "EUR" : "symbol" }}
      </div>
    </div>
    <div class="item-body">
      <h4 class="item-title center">
        <div class="item-link-title">
          {{ selectedProduct.name | uppercase }}
        </div>
      </h4>
      <div class="item-description">
        {{ selectedProduct.description }}
      </div>
    </div>
  </div>
</div>
